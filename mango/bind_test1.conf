#keyboard layout
#xkb_rules_layout=us,ru
#xkb_rules_options = grp:alt_shift_toggle

#common keymode
keymode=common
#bind=SUPER,w,setkeymode,default
#bind=SUPER,e,setkeymode,special
bind=SUPER,w,spawn,~/.config/mango/toggle_keymode.sh





# monitor switch
bind=Alt+SHIFT,h,focusmon,left
bind=Alt+SHIFT,l,focusmon,right
bind=Alt+SHIFT,k,focusmon,up
bind=Alt+SHIFT,j,focusmon,down
bind=Alt,h,tagmon,left
bind=Alt,l,tagmon,right
bind=Alt,k,tagmon,up
bind=Alt,j,tagmon,down


# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=alt,btn_middle,set_proportion,0.5
mousebind=SUPER,btn_right,moveresize,curresize
#mousebind=SUPER+CTRL,btn_left,minimized
#mousebind=SUPER+CTRL,btn_right,killclient
#mousebind=SUPER+CTRL,btn_middle,togglefullscreen
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=NONE,btn_left,toggleoverview,1
mousebind=NONE,btn_left, toggleoverview, 0
# mousebind=NONE,btn_right,killclient,0



# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=alt,UP,focusdir,left
axisbind=alt,DOWN,focusdir,right
axisbind=shift+super,UP,exchange_client,left
axisbind=shift+super,DOWN,exchange_client,right

# Gesturebind
#gesturebind=none,left,3,focusdir,left
#gesturebind=none,right,3,focusdir,right
#gesturebind=none,up,3,focusdir,up
#gesturebind=none,down,3,focusdir,down
#gesturebind=none,left,4,viewtoleft_have_client
#gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview,1
gesturebind=none,down,4,toggleoverview,1

# brightness and volume
bind=SUPER,comma,spawn,~/.config/mango/scripts/setup_monitors.sh
bind=SUPER,period,spawn,~/.config/mango/scripts/davinci_setup_monitors.sh
bind=ALT,comma,spawn,dms ipc call audio decrement 3
bind=ALT,period,spawn,dms ipc call audio increment 3




# change lang layout
bind=SUPER,space,spawn,~/.config/mango/notify-layout.sh && exec mmsg -k toggle 
 


#audio
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @default_audio_sink@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @default_audio_sink@ 5%-
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @default_source@ toggle

#screenshot
bind=SUPER,p,spawn,env QT_ENABLE_HIGHDPI_SCALING=0 flameshot gui
bind=SUPER,Print,spawn, ~/.config/mango/scripts/flameshot.sh

#default keymode
keymode=default

#bind=SUPER,Tab,focusstack,next
#keys
bind=SUPER,Return,spawn,alacritty
bind=SUPER,d,spawn,dms ipc call spotlight toggle
bind=SUPER,semicolon,spawn,emote
bind=SUPER,m,quit
bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglefakefullscreen
bind=SUPER,o,toggleoverview,0
bind=SUPER,s,toggle_scratchpad
bind=SUPER,a,minimized
bind=SUPER+SHIFT,a,restore_minimized
# bind=SUPER,semicolon,spawn,swaylock -f -c 000000
bind=SUPER,u,viewtoleft,0
bind=SUPER,i,viewtoright,0
bind=SUPER,v,togglefloating
bind=SUPER,c,reload_config
bind=SUPER+SHIFT,c,~/.config/mango/scripts/reload.sh

#move window focus with hjkl
#bind=SUPER,Left,focusdir,left
#bind=SUPER,Down,focusdir,down
#bind=SUPER,Up,focusdir,up
#bind=ALT,Right,focusdir,right

#move window focus with arrows
bind=SUPER,Tab,toggleoverview
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

#move window with arrows
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

#move window with arrows
#bind=SUPER+SHIFT,Left,exchange_client,left
#bind=SUPER+SHIFT,Down,exchange_client,down
#bind=SUPER+SHIFT,Up,exchange_client,up
#bind=SUPER+SHIFT,Right,exchange_client,right

#view tags
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,10,view,10,0

#move window to tag
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

