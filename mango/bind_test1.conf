#special keymode
keymode=special

bind=SUPER,x,setlayout,tile
bind=ALT,x,setlayout,vertical_tile
bind=SUPER,c,setlayout,center_tile
bind=SUPER,t,setlayout,right_tile
bind=SUPER,s,setlayout,scroller
bind=ALT,s,setlayout,vertical_scroller
bind=SUPER,a,setlayout,monocle
bind=SUPER,Tab,setlayout,grid
bind=ALT,Tab,setlayout,vertical_grid
bind=SUPER,d,setlayout,deck
bind=ALT,d,setlayout,vertical_deck
bind=SUPER,e,setlayout,tgmix

#resize window with hjkl
bind=SUPER,h,resizewin,-50,+0
bind=SUPER,j,resizewin,+0,+50
bind=SUPER,k,resizewin,+0,-50
bind=SUPER,l,resizewin,+50,+0

#resize window with arrows
bind=SUPER,Left,resizewin,-50,+0
bind=SUPER,Down,resizewin,+0,+50
bind=SUPER,Up,resizewin,+0,-50
bind=SUPER,Right,resizewin,+50,+0
# move window to tag
bind=ALT,1,tag,1,0
bind=ALT,2,tag,2,0
bind=ALT,3,tag,3,0
bind=ALT,4,tag,4,0
bind=ALT,5,tag,5,0
bind=ALT,6,tag,6,0
bind=ALT,7,tag,7,0
bind=ALT,8,tag,8,0
bind=ALT,9,tag,9,0
